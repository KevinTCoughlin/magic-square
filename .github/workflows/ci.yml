name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

# Cancel in-progress runs on new commits to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1-stable"  # Latest stable with a11y APIs

jobs:
  # Single job for all checks - saves runner startup time
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Lint first (fast, no Godot needed)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install gdtoolkit
        run: pip install gdtoolkit

      - name: Check formatting
        run: gdformat --check *.gd globals/*.gd resources/*.gd

      - name: Lint
        run: gdlint *.gd globals/*.gd resources/*.gd

      # Then Godot tests
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Import project
        run: godot --headless --import --quit

      - name: Run GUT tests
        run: godot --headless --script addons/gut/gut_cmdln.gd

  # Export builds on release tags only
  export:
    name: Export Game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - platform: linux
            export_name: "Linux"
            artifact: magic-square.x86_64
          - platform: windows
            export_name: "Windows Desktop"
            artifact: magic-square.exe
          - platform: macos
            export_name: "macOS"
            artifact: magic-square.app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          export-templates: true

      - name: Import project
        run: godot --headless --import --quit

      - name: Export ${{ matrix.platform }}
        run: |
          mkdir -p builds/${{ matrix.platform }}
          godot --headless --export-release "${{ matrix.export_name }}" builds/${{ matrix.platform }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: builds/${{ matrix.platform }}/
          retention-days: 1  # Minimal retention, release has permanent copies

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: builds/**/*
          generate_release_notes: true
