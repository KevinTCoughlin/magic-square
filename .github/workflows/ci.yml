name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.6-stable"

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install gdtoolkit
        run: pip install gdtoolkit

      - name: Check formatting
        run: gdformat --check *.gd globals/*.gd resources/*.gd

      - name: Lint
        run: gdlint *.gd globals/*.gd resources/*.gd

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Import project
        run: godot --headless --import --quit

      - name: Run GUT tests
        run: godot --headless --script addons/gut/gut_cmdln.gd

  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Verify project loads
        run: godot --headless --import --quit

  # Export builds on release tags
  export:
    name: Export Game
    runs-on: ubuntu-latest
    needs: [lint, test, validate]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - platform: linux
            export_name: "Linux"
            artifact: magic-square.x86_64
          - platform: windows
            export_name: "Windows Desktop"
            artifact: magic-square.exe
          - platform: macos
            export_name: "macOS"
            artifact: magic-square.app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          export-templates: true

      - name: Import project
        run: godot --headless --import --quit

      - name: Export ${{ matrix.platform }}
        run: |
          mkdir -p builds/${{ matrix.platform }}
          godot --headless --export-release "${{ matrix.export_name }}" builds/${{ matrix.platform }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: builds/${{ matrix.platform }}/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: builds/**/*
          generate_release_notes: true
